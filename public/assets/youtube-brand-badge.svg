<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Dark Studio Glow with YouTube Crimson Aura -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a0509" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#0f1118" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="redAura" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="headerBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(244,63,94,0.15)"/>
      <stop offset="100%" stop-color="rgba(244,63,94,0.05)"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Studio Background -->
  <rect width="800" height="480" fill="url(#bgGlow)"/>
  <rect width="800" height="480" fill="url(#redAura)"/>

  <!-- Tech Grid Coordinate Overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
  </g>

  <!-- Subtle Ambient Corner Accents -->
  <circle cx="400" cy="205" r="160" fill="none" stroke="rgba(244,63,94,0.08)" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Top Ecosystem Chip -->
  <g transform="translate(400, 85)">
    <rect x="-130" y="-13" width="260" height="26" rx="13" fill="url(#headerBadge)" stroke="rgba(244,63,94,0.3)" stroke-width="1"/>
    <circle cx="-108" cy="0" r="3.5" fill="#f43f5e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-95" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#fda4af" letter-spacing="1.5">OFFICIAL EXTENSION ECOSYSTEM</text>
  </g>

