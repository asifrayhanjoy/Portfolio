  <!-- =========================================================================
       AUTHENTIC EXTENSION BADGE (Manifest V3 · Chrome Architecture)
       ========================================================================= -->
  <g transform="translate(400, 268)">
    <!-- Sleek Glass Pill -->
    <rect x="-170" y="-19" width="340" height="38" rx="19" fill="rgba(10, 15, 26, 0.9)" stroke="url(#badgeBorder)" stroke-width="1.5"/>
    
    <!-- Chrome Extension Puzzle Icon (Vector) -->
    <g transform="translate(-148, -9) scale(0.75)" fill="#f43f5e">
      <path d="M19 13h-2V9c0-1.1-.9-2-2-2h-4c0-1.66-1.34-3-3-3S5 5.34 5 7H1c-1.1 0-2 .9-2 2v4c1.66 0 3 1.34 3 3s-1.34 3-3 3v4c0 1.1.9 2 2 2h4c0-1.66 1.34-3 3-3s3 1.34 3 3h4c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3z"/>
    </g>
    
    <!-- Authentic Extension Badge Text -->
    <text x="-124" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc" letter-spacing="1.2">YOUTUBE CLEANER</text>
    
    <!-- Separator Dot -->
    <circle cx="18" cy="0" r="2" fill="#94a3b8"/>
    
    <!-- MV3 Pill Indicator -->
    <g transform="translate(30, -9)">
      <rect x="0" y="0" width="118" height="18" rx="9" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1"/>
      <circle cx="9" cy="9" r="2.5" fill="#22c55e"/>
      <text x="18" y="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#4ade80" letter-spacing="0.8">MANIFEST V3</text>
    </g>
  </g>
</svg>
